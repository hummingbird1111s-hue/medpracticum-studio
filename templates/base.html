{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#059669">
  <title>{% block title %}MedPracticum Studio{% endblock %}</title>

  <link rel="manifest" href="{% url 'manifest' %}">
  <link rel="icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MedPracticum">

  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
  <script src="{% static 'vendor/htmx.min.js' %}"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

  <nav class="bg-emerald-700 text-white">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <a href="{% url 'dashboard' %}" class="font-bold text-lg">MedPracticum Studio</a>
      <div class="flex items-center gap-2">
        <button id="install-btn" type="button"
                class="hidden text-sm bg-white text-emerald-800 rounded-lg px-3 py-1.5 font-medium">
          Install app
        </button>
        {% if user.is_authenticated %}
          <form method="post" action="{% url 'logout' %}" data-logout>
            {% csrf_token %}
            <button type="submit" class="text-sm bg-emerald-800 hover:bg-emerald-900 rounded-lg px-3 py-1.5">
              Log out
            </button>
          </form>
        {% endif %}
      </div>
    </div>
  </nav>

  <div id="mp-banner" class="hidden bg-amber-100 text-amber-900 text-sm text-center px-4 py-2"></div>

  <main class="max-w-3xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'js/offline-sync.js' %}"></script>
  <script src="{% static 'js/pwa.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
