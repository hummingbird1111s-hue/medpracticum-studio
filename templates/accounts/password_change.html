{% extends 'base.html' %}
{% block title %}Change password · MedPracticum Studio{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-2xl font-bold mb-1">Change password</h1>
  <p class="text-sm text-gray-600 mb-6">
    Enter your current password, then your new one twice.
  </p>

  <form method="post" class="bg-white rounded-2xl shadow p-6">
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}

    <div class="pt-4 border-t border-gray-100 mt-4 flex flex-col md:flex-row gap-2">
      <button type="submit"
              class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg py-2.5 transition">
        Update password
      </button>
      <a href="{% url 'profile' %}"
         class="flex-1 text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg py-2.5 transition">
        Cancel
      </a>
    </div>
  </form>
</div>
{% endblock %}
