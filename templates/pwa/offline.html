<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#059669">
  <title>Offline · MedPracticum Studio</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f9fafb; color: #111827;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.12);
            padding: 28px; max-width: 360px; text-align: center; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { font-size: .9rem; color: #4b5563; margin: 0 0 18px; }
    button { background: #059669; color: #fff; border: 0; border-radius: 10px;
             padding: 10px 20px; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>This page hasn't been saved on your device yet. Reconnect once and open it, then it will work without internet. Logs you already saved on this device are safe and will sync when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
