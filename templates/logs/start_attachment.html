{% extends 'base.html' %}
{% block title %}Start attachment · MedPracticum Studio{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow p-6 max-w-md mx-auto">
  <h1 class="text-2xl font-bold mb-1">Start your attachment</h1>
  <p class="text-sm text-gray-600 mb-6">Tell us where you're posted and for how long.</p>

  <form method="post">
    {% csrf_token %}
    {% include 'partials/form_fields.html' %}
    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg py-2.5">
      Save attachment
    </button>
  </form>
</div>
{% endblock %}
