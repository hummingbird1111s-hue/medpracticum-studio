<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#059669">
  <title>Offline — MedPracticum Studio</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: #f9fafb; color: #111827;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #ffffff; border: 1px solid #e5e7eb; border-radius: 16px;
      padding: 32px 24px; max-width: 420px; width: 100%; text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .icon { font-size: 56px; margin-bottom: 12px; line-height: 1; }
    h1 { font-size: 20px; margin: 0 0 8px; font-weight: 700; color: #047857; }
    p { color: #6b7280; font-size: 14px; margin: 0 0 20px; line-height: 1.5; }
    button {
      background: #059669; color: #ffffff; border: 0;
      padding: 12px 24px; border-radius: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #047857; }
    .hint { margin-top: 16px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>You're offline</h1>
    <p>MedPracticum Studio needs an internet connection. Check your network and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="hint">Any unsaved form data will be restored when you reconnect.</div>
  </div>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
